    '1': 只有泛稱別擔心或機械同理
    '2': 連結父親經驗命名擔憂，表達理解與共同面對
  fact_ids:
  - F03
  - F04
  star: true
  generic: false
  main_construct: true
  lqqopera: false
  sp_prompted: false
- id: C05
  text: 用白話說明糖尿病前期與進展的不確定性
  anchors:
    '0': 錯誤宣稱已確診或必然洗腎，或未說明
    '1': 僅說明高於正常或不一定進展其中一項
    '2': 說明高於正常但未達糖尿病，並指出非必然進展且可採行動降低風險
  fact_ids:
  - F02
