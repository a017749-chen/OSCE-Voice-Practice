station_type: history
number: '1'
sign: 46歲女性，反覆上腹痛
candidate:
  background: 你是門診實習醫學生，接待反覆上腹痛病人
  tasks:
  - 完成聚焦病史詢問
  - 向病人摘要並確認資訊
  notes:
  - 本站不評分身體檢查、診斷告知或治療處方。
  available_data: 下列生命徵象與主訴進站即可取得；沒有檢驗或影像可追加。其他病史由考生詢問。
  report:
    vitals: BP 122/76 mmHg、HR 78/min、RR 16/min、BT 36.7°C
    symptoms: 反覆上腹痛，目前無痛
    other: 尚未進行血液檢驗或影像檢查
    other_2: 本次只進行病史詢問
examiner:
  setting: 一般門診
  sp_profile: 46 歲女性林雅雯，餐飲店工作者，虛構角色
  start_position: 坐於診椅，身體微向前，當下無疼痛
  props: 考生指引、生命徵象卡、桌椅、語音設備、外部計時器；真人版可設考官一人
  summary: 林雅雯，46 歲，兩個月內三次右上腹悶緊痛，最近一次為昨天晚餐後，約 90 分鐘自行緩解，最痛 6/10，可延伸右背。油膩餐點後出現，會噁心但未吐；無發燒寒顫、黃疸、深色尿、灰白便、黑便吐血或心肺症狀。曾被說有胃炎，未做超音波。擔心肝病，想找出原因。病史較支持膽石相關疼痛，但尚無影像確認；不應稱已確診膽囊炎。
  differentials:
  - 症狀性膽結石／膽絞痛（待檢查確認）
  - 消化性潰瘍或胃炎
  - 功能性消化不良
  - 急性冠心症等需依病史辨識的重要鑑別
sp:
  setting: 一般門診
  start_position: 坐於診椅，雙手放在腿上
  emotion: 擔心4/10；目前疼痛0/10
  manner: 神情稍擔憂，沒有冒汗、痛苦扭動或黃疸表演
  voice: 平常口語，語速正常，回答一至三短句
  principles: 只按被問範圍回答，不主動問考點。開放問題可敘述對應範圍，不逐字關鍵字考驗。資料前後一致；結束後才回饋。
  summary: 46歲林雅雯，兩個月三次右上腹間歇悶緊痛，油膩餐後出現，最近一次90分鐘後自行緩解；無感染、膽汁鬱積、出血或心肺症狀。擔心肝病。
  dialogue:
  - frame: 開場
    candidate: 今天哪裡不舒服？
    sp: 我這兩個月上腹會痛，想來問看看。
    question: false
  - frame: 時間型態
    candidate: 請從第一次開始說。
    sp: 兩個月前第一次，總共三次，最近一次是昨天晚餐後。
    question: false
  - frame: 疼痛特徵
    candidate: 痛在哪裡，會跑到別的地方嗎？
    sp: 右邊上腹悶緊，有時到右背。
    question: false
  - frame: 感染警訊
    candidate: 有發燒或冷到發抖嗎？
    sp: 都沒有。
    question: false
  - frame: 膽汁鬱積
    candidate: 有變黃、尿變深或便變灰白嗎？
    sp: 沒有這些情形。
    question: false
  - frame: 病人觀點
    candidate: 您最擔心什麼？
    sp: 怕是肝不好，想知道原因。
    question: false
  - frame: 摘要核對
    candidate: 兩個月是間歇三次，這樣對嗎？
    sp: 對，不是每天痛。
    question: false
  room_diagram: 【門診】SP坐診桌左側，考生坐右側；真人版考官位於考生右後方；門與拉簾在後方。語音版只需安靜空間與耳麥。
